name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out presentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select ORD specification ref
        id: specification-ref
        env:
          PRESENTATION_HEAD_REF: ${{ github.head_ref }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/open-resource-discovery/specification.git "refs/heads/$PRESENTATION_HEAD_REF" >/dev/null; then
            echo "ref=$PRESENTATION_HEAD_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out ORD specification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-resource-discovery/specification
          ref: ${{ steps.specification-ref.outputs.ref }}
          path: ord-public
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - name: Install pinned npm for dependency policy
        run: npm install --global --ignore-scripts npm@11.20.0 --registry=https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check shared diagram data
        run: npm run check:diagrams -- --spec-root=ord-public
      - name: Build GitHub Pages artifact
        run: npm run build:pages
      - name: Install inspection browser
        run: npx playwright install --with-deps chromium --only-shell
      - name: Test visual inspection
        run: npm run test:inspection
      - name: Inspect all slides
        run: npm run inspect
      - name: Upload slide inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slide-inspection
          path: screenshots/
          if-no-files-found: ignore
